# Default permission set for tauri-plugin-multiline-taskband.
#
# Covers core rendering plus the read-only queries. High-impact commands
# (remove, menu injection, popup window control) are intentionally NOT
# included — grant them explicitly, e.g.
# `multiline-taskband:allow-remove`.
#
# This matches the default set of the sibling multiline-menubar plugin, so an
# app that targets both platforms gets the same baseline either way.

[default]
description = "Default permissions for the multiline-taskband plugin (core rendering + read-only queries). High-impact commands (remove, menu injection, popup window control) are intentionally NOT included — grant them explicitly, e.g. `multiline-taskband:allow-remove`."
permissions = [
  "allow-create",
  "allow-set-text",
  "allow-set-font-sizes",
  "allow-set-font-family",
  "allow-set-padding",
  "allow-set-side",
  "allow-set-order",
  "allow-set-margin",
  "allow-set-colors",
  "allow-set-bold",
  "allow-set-alignment",
  "allow-set-visible",
  "allow-rect",
  "allow-is-visible",
  "allow-set-auto-popup",
]
