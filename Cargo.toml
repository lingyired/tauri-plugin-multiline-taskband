[package]
name = "tauri-plugin-multiline-taskband"
version = "1.0.0"
authors = [ "tauri-plugin-multiline-taskband" ]
description = "A Tauri plugin that renders two-line text labels on the left and right edges of the Windows taskbar."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-multiline-taskband"

[dependencies]
tauri = "2"
serde = "1.0"
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
] }
# Icon rendering. These are Windows-only because nothing outside
# `native::windows` paints pixels.
#
# `resvg` is deliberately built without default features: icons need neither
# <text> rendering (which pulls fontdb + ttf-parser + the system font stack)
# nor embedded raster images (jpeg/gif/webp codecs) nor SVGZ.
resvg = { version = "0.48", default-features = false }
# PNG / ICO / BMP sources. Also without default features — no encoders, no
# formats an icon would never ship in.
image = { version = "0.25", default-features = false, features = ["png", "ico", "bmp"] }
# Decoding inline `data:...;base64,` payloads.
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
