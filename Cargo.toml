[package]
name = "tauri-plugin-multiline-taskband"
version = "0.1.0"
authors = [ "tauri-plugin-multiline-taskband" ]
description = "A Tauri plugin that renders two-line text labels on the left and right edges of the Windows taskbar."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-multiline-taskband"

[dependencies]
tauri = "2"
serde = "1.0"
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
