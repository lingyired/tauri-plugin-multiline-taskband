<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskband Item Settings</title>
    <script>
      // ?theme=light pins the light palette (preview on dark systems)
      if (new URLSearchParams(location.search).get("theme") === "light") {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="/popup.js" defer></script>
  </head>

  <body>
    <main class="pop">
      <header class="pop-head" data-tauri-drag-region>
        <span id="pop-side-dot" class="side-dot" data-side="right" aria-hidden="true"></span>
        <div class="pop-title" data-tauri-drag-region>
          <span id="pop-id" class="mono">…</span>
          <span class="pop-sub">taskband item</span>
        </div>
        <button type="button" id="popup-close" class="icon-btn" title="Close" aria-label="Close">
          <svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
          </svg>
        </button>
      </header>

      <div class="pop-scroll">
        <section aria-label="Live preview">
          <p class="eyebrow">On the taskbar</p>
          <div class="taskbar-sim" aria-hidden="true">
            <span class="sim-start"></span>
            <div class="sim-chip" id="sim-chip">
              <span class="sim-line" id="sim-top">&nbsp;</span>
              <span class="sim-line" id="sim-bottom">&nbsp;</span>
            </div>
            <span class="sim-clock">09:41</span>
          </div>
          <p class="hint">
            Live preview. The system-default color follows your light / dark
            theme, exactly like the real item.
          </p>
        </section>

        <section class="line-sec" aria-label="Top line">
          <div class="sec-head">
            <span class="eyebrow"><span class="line-dot" id="top-dot"></span>Top line</span>
          </div>
          <input type="text" id="popup-top" placeholder="e.g. HOLDINGS" autocomplete="off" spellcheck="false" />
          <div class="lrow">
            <input type="range" id="popup-top-size" min="6" max="24" step="1" value="11" aria-label="Top line size (pt)" />
            <output id="popup-top-size-value" class="size-val" for="popup-top-size">11 pt</output>
          </div>
          <input type="text" id="popup-top-family" class="family-input" placeholder="Font family · blank = system"
                 autocomplete="off" spellcheck="false" aria-label="Top line font family" />
          <div class="lrow">
            <div class="seg" role="group" aria-label="Top line color mode" data-group="cmode-top">
              <button type="button" data-cmode="default" aria-pressed="true">System</button>
              <button type="button" data-cmode="solid" aria-pressed="false">Custom</button>
            </div>
            <div class="color-custom" id="popup-top-solid-row" hidden>
              <input type="color" id="popup-top-color" class="swatch" value="#ffffff" aria-label="Top line color" />
              <input type="text" id="popup-top-hex" class="hex-input" value="#ffffff" autocomplete="off"
                     spellcheck="false" aria-label="Top line hex value" />
            </div>
          </div>
          <div class="lrow bold-row">
            <label class="bold-label">
              <span class="switch sm">
                <input type="checkbox" id="popup-top-bold" />
                <span class="slider"></span>
              </span>
              Bold
            </label>
            <div class="seg seg-icons" role="group" aria-label="Top line alignment" data-group="align-top">
              <button type="button" data-align="0" aria-pressed="true" title="Align left">
                <svg viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
                  <path d="M1.5 3h11M1.5 7h7M1.5 11h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
                </svg>
              </button>
              <button type="button" data-align="1" aria-pressed="false" title="Align center">
                <svg viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
                  <path d="M1.5 3h11M3.5 7h7M2.5 11h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
                </svg>
              </button>
              <button type="button" data-align="2" aria-pressed="false" title="Align right">
                <svg viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
                  <path d="M1.5 3h11M5.5 7h7M3.5 11h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
                </svg>
              </button>
            </div>
          </div>
        </section>

        <section class="line-sec" aria-label="Bottom line">
          <div class="sec-head">
            <span class="eyebrow"><span class="line-dot" id="bottom-dot"></span>Bottom line</span>
          </div>
          <input type="text" id="popup-bottom" placeholder="e.g. +1.23%" autocomplete="off" spellcheck="false" />
          <div class="lrow">
            <input type="range" id="popup-bottom-size" min="6" max="24" step="1" value="11" aria-label="Bottom line size (pt)" />
            <output id="popup-bottom-size-value" class="size-val" for="popup-bottom-size">11 pt</output>
          </div>
          <input type="text" id="popup-bottom-family" class="family-input" placeholder="Font family · blank = system"
                 autocomplete="off" spellcheck="false" aria-label="Bottom line font family" />
          <div class="lrow">
            <div class="seg" role="group" aria-label="Bottom line color mode" data-group="cmode-bottom">
              <button type="button" data-cmode="default" aria-pressed="true">System</button>
              <button type="button" data-cmode="solid" aria-pressed="false">Custom</button>
            </div>
            <div class="color-custom" id="popup-bottom-solid-row" hidden>
              <input type="color" id="popup-bottom-color" class="swatch" value="#ffffff" aria-label="Bottom line color" />
              <input type="text" id="popup-bottom-hex" class="hex-input" value="#ffffff" autocomplete="off"
                     spellcheck="false" aria-label="Bottom line hex value" />
            </div>
          </div>
          <div class="lrow bold-row">
            <label class="bold-label">
              <span class="switch sm">
                <input type="checkbox" id="popup-bottom-bold" />
                <span class="slider"></span>
              </span>
              Bold
            </label>
            <div class="seg seg-icons" role="group" aria-label="Bottom line alignment" data-group="align-bottom">
              <button type="button" data-align="0" aria-pressed="true" title="Align left">
                <svg viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
                  <path d="M1.5 3h11M1.5 7h7M1.5 11h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
                </svg>
              </button>
              <button type="button" data-align="1" aria-pressed="false" title="Align center">
                <svg viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
                  <path d="M1.5 3h11M3.5 7h7M2.5 11h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
                </svg>
              </button>
              <button type="button" data-align="2" aria-pressed="false" title="Align right">
                <svg viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
                  <path d="M1.5 3h11M5.5 7h7M3.5 11h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
                </svg>
              </button>
            </div>
          </div>
        </section>

        <section class="line-sec pos-sec" aria-label="Position on the taskbar">
          <span class="eyebrow">Position</span>
          <div class="lrow">
            <span class="pos-label">Edge</span>
            <div class="seg" role="group" aria-label="Taskbar side" data-group="side">
              <button type="button" data-side="left" aria-pressed="false">Left · Start</button>
              <button type="button" data-side="right" aria-pressed="true">Right · tray</button>
            </div>
          </div>
          <div class="lrow">
            <span class="pos-label">Padding</span>
            <span class="num grow">
              <input type="number" id="popup-pad-left" min="0" max="24" step="1" value="4" aria-label="Left padding (physical pixels)" />
              <span class="unit">px</span>
            </span>
            <span class="num grow">
              <input type="number" id="popup-pad-right" min="0" max="24" step="1" value="4" aria-label="Right padding (physical pixels)" />
              <span class="unit">px</span>
            </span>
          </div>
        </section>
      </div>

      <footer class="pop-foot">
        <button type="button" id="popup-reset" class="btn ghost sm">Reset appearance</button>
        <span id="pop-saved" class="saved" role="status" aria-live="polite"></span>
      </footer>
    </main>
  </body>
</html>
