<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskband Item Settings</title>
    <style>
      /* Visual style mirrors the multiline-menubar demo's popup. */
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .card {
        margin: 12px;
        height: calc(100% - 24px);
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 14px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        color: #1d1d1f;
        overflow-y: auto;
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: rgba(40, 40, 44, 0.95);
          border-color: rgba(255, 255, 255, 0.08);
          color: #f2f2f7;
        }
      }
      h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 12px;
        opacity: 0.7;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      input[type="text"],
      input[type="number"] {
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: rgba(255, 255, 255, 0.6);
        color: inherit;
        font-size: 13px;
      }
      input[type="color"] {
        padding: 0;
        height: 30px;
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        cursor: pointer;
      }
      input[type="range"] {
        width: 100%;
      }
      select {
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: rgba(255, 255, 255, 0.6);
        color: inherit;
        font-size: 12px;
      }
      @media (prefers-color-scheme: dark) {
        input[type="text"],
        input[type="number"],
        select {
          border-color: rgba(255, 255, 255, 0.15);
          background: rgba(0, 0, 0, 0.25);
        }
      }
      fieldset.colors {
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
        padding: 8px 10px;
        margin: 0;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      @media (prefers-color-scheme: dark) {
        fieldset.colors {
          border-color: rgba(255, 255, 255, 0.15);
        }
      }
      legend {
        font-size: 11px;
        font-weight: 600;
        opacity: 0.85;
        padding: 0 4px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > .field {
        flex: 1;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        border-radius: 9px;
        border: none;
        background: #0a84ff;
        color: white;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.secondary {
        background: rgba(0, 0, 0, 0.12);
        color: inherit;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2 id="popup-header">Instance settings</h2>
      <p>Edit this taskbar instance's text and appearance below.</p>

      <fieldset class="colors">
        <legend>Text</legend>
        <div class="field">
          <label for="popup-top">Top label</label>
          <input type="text" id="popup-top" value="" />
        </div>
        <div class="field">
          <label for="popup-bottom">Bottom value</label>
          <input type="text" id="popup-bottom" value="" />
        </div>
        <div class="row">
          <button id="popup-text-update">Update</button>
          <button id="popup-text-reset" class="secondary">Reset</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Font size</legend>
        <div class="field">
          <label for="popup-top-size">
            Top line size (<span id="popup-top-size-value">11</span> pt)
          </label>
          <input type="range" id="popup-top-size" min="6" max="24" step="1" value="11" />
        </div>
        <div class="field">
          <label for="popup-bottom-size">
            Bottom line size (<span id="popup-bottom-size-value">11</span> pt)
          </label>
          <input type="range" id="popup-bottom-size" min="6" max="24" step="1" value="11" />
        </div>
        <div class="row">
          <button id="popup-sizes">Apply sizes</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Font family</legend>
        <div class="field">
          <label for="popup-top-family">Top line family (blank = system font)</label>
          <input type="text" id="popup-top-family" value="" placeholder="System font" />
        </div>
        <div class="field">
          <label for="popup-bottom-family">Bottom line family (blank = system font)</label>
          <input type="text" id="popup-bottom-family" value="" placeholder="System font" />
        </div>
        <div class="row">
          <button id="popup-families">Apply fonts</button>
          <button id="popup-families-reset" class="secondary">Reset</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Padding (physical px)</legend>
        <div class="row">
          <div class="field">
            <label for="popup-pad-left">Left padding</label>
            <input type="number" id="popup-pad-left" min="0" max="24" step="1" value="4" />
          </div>
          <div class="field">
            <label for="popup-pad-right">Right padding</label>
            <input type="number" id="popup-pad-right" min="0" max="24" step="1" value="4" />
          </div>
        </div>
        <div class="row">
          <button id="popup-padding">Apply padding</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Side</legend>
        <div class="field">
          <label for="popup-side">Side of the taskbar</label>
          <select id="popup-side">
            <option value="left">left (taskbar left edge)</option>
            <option value="right" selected>right (notification area)</option>
          </select>
        </div>
        <div class="row">
          <button id="popup-side-apply">Apply side</button>
          <button id="popup-side-reset" class="secondary">Reset to right</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Top line color</legend>
        <div class="field">
          <label for="popup-top-color">Color</label>
          <input type="color" id="popup-top-color" value="#ffffff" />
        </div>
        <div class="field">
          <label for="popup-top-hex">Hex (auto-filled, editable)</label>
          <input type="text" id="popup-top-hex" value="#ffffff" />
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Bottom line color</legend>
        <div class="field">
          <label for="popup-bottom-color">Color</label>
          <input type="color" id="popup-bottom-color" value="#ffffff" />
        </div>
        <div class="field">
          <label for="popup-bottom-hex">Hex (auto-filled, editable)</label>
          <input type="text" id="popup-bottom-hex" value="#ffffff" />
        </div>
        <div class="row">
          <button id="popup-colors">Apply colors</button>
          <button id="popup-reset-colors" class="secondary">Reset</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Bold</legend>
        <div class="field">
          <label><input type="checkbox" id="popup-top-bold" /> Bold top line</label>
        </div>
        <div class="field">
          <label><input type="checkbox" id="popup-bottom-bold" /> Bold bottom line</label>
        </div>
        <div class="row">
          <button id="popup-bold">Apply bold</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Alignment (per line)</legend>
        <div class="field">
          <label for="popup-top-align">Top line</label>
          <select id="popup-top-align">
            <option value="0" selected>Left</option>
            <option value="1">Center</option>
            <option value="2">Right</option>
          </select>
        </div>
        <div class="field">
          <label for="popup-bottom-align">Bottom line</label>
          <select id="popup-bottom-align">
            <option value="0" selected>Left</option>
            <option value="1">Center</option>
            <option value="2">Right</option>
          </select>
        </div>
        <div class="row">
          <button id="popup-alignment">Apply alignment</button>
        </div>
      </fieldset>

      <div class="row">
        <button id="popup-close" class="secondary">Close</button>
      </div>
    </div>
    <script type="module" src="/popup.js" defer></script>
  </body>
</html>
