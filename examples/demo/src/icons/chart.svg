<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Multicolour asset: with "Tint" off the SVG keeps its own colours, which
       demonstrates that the image channel does full colour compositing. -->
  <rect x="4" y="12" width="4" height="8" rx="1" fill="#e5484d"/>
  <rect x="10" y="5" width="4" height="15" rx="1" fill="#30a46c"/>
  <rect x="16" y="9" width="4" height="11" rx="1" fill="#e5484d"/>
</svg>
